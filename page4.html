const nSrc = DATA.n_src;

const tgtZones = DATA.tgt_zones;

const selTgt = document.getElementById('filter-tgt');
[...Array(nTgt).keys()].sort((a,b)=>tgtZones[a]-tgtZones[b]||a-b).forEach(t=>{
  const o=document.createElement('option'); o.value=t;
  const n=labels[t+nSrc]; o.textContent=`[Zone ${tgtZones[t]}] ${n.length>32?n.substring(0,30)+'…':n}`;
  selTgt.appendChild(o);

document.getElementById('thresh').addEventListener('input',function(){threshVal=+this.value;document.getElementById('thresh-val').textContent=this.value;draw();});
document.getElementById('btn-reset').addEventListener('click',function(){
  selSrc.value='all';selTgt.value='all';document.getElementById('thresh').value=0;document.getElementById('thresh-val').textContent='0';
  filterSrc='all';filterTgt='all';threshVal=0;draw();

function draw() {
  const svg=d3.select('#sankey-svg'); svg.selectAll('*').remove();
  let flows=DATA.src.map((s,i)=>({s,t:DATA.tgt[i]-nSrc,v:DATA.val[i]}));

  if(filterTgt!=='all') flows=flows.filter(f=>f.t===filterTgt);
  flows=flows.filter(f=>f.v>=threshVal);

  document.getElementById('stat-links').textContent=flows.length;

  const H=Math.max(480,activeTgt.length*(perRow+4)+60);
  const margin={top:20,right:248,bottom:20,left:120};
  const iW=W-margin.left-margin.right, iH=H-margin.top-margin.bottom, nodeW=12;

  svg.attr('width',W).attr('height',H);
  const g=svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

  const srcTotals={}, tgtTotals={};
  activeSrc.forEach(s=>srcTotals[s]=0); activeTgt.forEach(t=>tgtTotals[t]=0);
  flows.forEach(f=>{srcTotals[f.s]=(srcTotals[f.s]||0)+f.v; tgtTotals[f.t]=(tgtTotals[f.t]||0)+f.v;});

  const srcGap=5, srcH=iH-(activeSrc.length-1)*srcGap;
  const srcNodeH={},srcY={};let cy=0;
  activeSrc.forEach(s=>{srcNodeH[s]=(srcTotals[s]/totalFlow)*srcH;srcY[s]=cy;cy+=srcNodeH[s]+srcGap;});

  const tgtGap=3, tgtH=iH-(activeTgt.length-1)*tgtGap;
  const tgtNodeH={},tgtY={};cy=0;
  activeTgt.forEach(t=>{tgtNodeH[t]=(tgtTotals[t]/totalFlow)*tgtH;tgtY[t]=cy;cy+=tgtNodeH[t]+tgtGap;});

  const srcOff={},tgtOff={};
  activeSrc.forEach(s=>srcOff[s]=0); activeTgt.forEach(t=>tgtOff[t]=0);
  flows.sort((a,b)=>tgtZones[a.t]-tgtZones[b.t]||a.t-b.t);

  flows.forEach(f=>{
    const h=(f.v/totalFlow)*iH, sy=srcY[f.s]+srcOff[f.s], ty=tgtY[f.t]+tgtOff[f.t];
    srcOff[f.s]+=h; tgtOff[f.t]+=h;
    const cx=iW/2, color=srcColors[f.s%srcColors.length];
    const path=g.append('path')
      .attr('d',`M${nodeW},${sy} C${cx},${sy} ${cx},${ty} ${iW},${ty} L${iW},${ty+h} C${cx},${ty+h} ${cx},${sy+h} ${nodeW},${sy+h} Z`)

    path.on('mouseover',function(ev){
      d3.select(this).attr('opacity',0.65); tooltip.style.opacity=1;
      tooltip.innerHTML=`<b>${labels[f.s]}</b><br>→ ${labels[f.t+nSrc]}<br>Zone ${tgtZones[f.t]}<br>จำนวน: <b>${f.v.toLocaleString()}</b>`;

    }).on('mouseout',function(){d3.select(this).attr('opacity',0.28);tooltip.style.opacity=0;});
  });

  activeSrc.forEach(s=>{
    const color=srcColors[s%srcColors.length];
    g.append('rect').attr('x',0).attr('y',srcY[s]).attr('width',nodeW).attr('height',srcNodeH[s]).attr('fill',color).attr('rx',2);

  });

    leg.innerHTML+=`<span class="legend-item"><span class="legend-swatch" style="background:${srcColors[s%srcColors.length]}"></span>${labels[s]} (${srcTotals[s].toLocaleString()})</span>`;
  });
